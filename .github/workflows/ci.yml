name: Cross-platform CI

on:
  push:
  pull_request:

jobs:
  build-windows-helper:
    name: Windows x64 Helper
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run Node tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Build Windows Helper
        run: npm run build:helper:windows

      - name: Verify Windows Helper
        shell: pwsh
        run: |
          $helper = 'runtime/bin/win32-x64/dsh-dafeiyu-helper.exe'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Missing Windows Helper: $helper"
          }

      - name: Upload Windows Helper
        uses: actions/upload-artifact@v4
        with:
          name: windows-helper
          path: runtime/bin/win32-x64/dsh-dafeiyu-helper.exe
          if-no-files-found: error

  build-macos-helper:
    name: macOS arm64 Helper
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run Node tests
        run: npm test

      - name: Run Python tests
        run: npm run test:python

      - name: Build macOS Helper
        run: npm run build:helper:mac

      - name: Verify macOS Helper
        run: |
          helper='runtime/bin/darwin-arm64/dsh-dafeiyu-helper'
          test -f "$helper"
          file "$helper" | grep -q 'Mach-O 64-bit executable arm64'

      - name: Archive macOS Helper
        run: tar -czf macos-helper.tar.gz -C runtime/bin/darwin-arm64 dsh-dafeiyu-helper

      - name: Upload macOS Helper
        uses: actions/upload-artifact@v4
        with:
          name: macos-helper
          path: macos-helper.tar.gz
          if-no-files-found: error

  package-cross-platform:
    name: Cross-platform package
    needs:
      - build-windows-helper
      - build-macos-helper
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows Helper
        uses: actions/download-artifact@v4
        with:
          name: windows-helper
          path: runtime/bin/win32-x64

      - name: Download macOS Helper
        uses: actions/download-artifact@v4
        with:
          name: macos-helper
          path: .artifacts/macos-helper

      - name: Restore macOS Helper
        run: |
          mkdir -p runtime/bin/darwin-arm64
          tar -xzf .artifacts/macos-helper/macos-helper.tar.gz -C runtime/bin/darwin-arm64

      - name: Verify restored Helpers
        run: |
          test -f runtime/bin/win32-x64/dsh-dafeiyu-helper.exe
          test -f runtime/bin/darwin-arm64/dsh-dafeiyu-helper
          test -x runtime/bin/darwin-arm64/dsh-dafeiyu-helper
          file runtime/bin/darwin-arm64/dsh-dafeiyu-helper | grep -q 'Mach-O 64-bit executable arm64'

      - name: Create cross-platform package
        run: npm pack

      - name: Verify cross-platform package contents
        run: |
          package_file="$(node -e \"const p=require('./package.json'); process.stdout.write(p.name + '-' + p.version + '.tgz')\")"
          test -f "$package_file"
          tar -tzf "$package_file" | grep -Fxq 'package/runtime/bin/win32-x64/dsh-dafeiyu-helper.exe'
          tar -tzf "$package_file" | grep -Fxq 'package/runtime/bin/darwin-arm64/dsh-dafeiyu-helper'
